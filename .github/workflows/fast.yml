name: fast
on:
  schedule:
    - cron: "*/30 * * * *"   # backup only: the cloud starts a run every 10 min if none is waiting
  workflow_dispatch:
    inputs:
      force:
        description: "Read even if the laptop app is online (testing)"
        default: "0"
concurrency:
  group: fast
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the reader loops ~340 min; GitHub allows 360
    strategy:
      fail-fast: false
      matrix:
        shard: [co0, co1, careers]   # target-company LinkedIn searches (2 machines) + company career sites and the blog poke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python reader.py
        env:
          FP_CLOUD_URL: ${{ secrets.FP_CLOUD_URL }}
          FP_CLOUD_SECRET: ${{ secrets.FP_CLOUD_SECRET }}
          FP_FORCE: ${{ github.event.inputs.force || '0' }}
          FP_SHARD: ${{ matrix.shard }}
