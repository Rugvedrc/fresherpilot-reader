name: read
on:
  schedule:
    - cron: "*/30 * * * *"   # backup only: the cloud starts a run every 10 min if none is waiting
  workflow_dispatch:
    inputs:
      force:
        description: "Read even if the laptop app is online (testing)"
        default: "0"
concurrency:
  group: read
  cancel-in-progress: false
permissions:
  contents: write   # only for the monthly keep-alive commit
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the reader loops ~340 min; GitHub allows 360
    strategy:
      fail-fast: false
      matrix:
        shard: [li0, li1, indeed]   # 3 machines at once: half the LinkedIn searches each, and Indeed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python reader.py
        env:
          FP_CLOUD_URL: ${{ secrets.FP_CLOUD_URL }}
          FP_CLOUD_SECRET: ${{ secrets.FP_CLOUD_SECRET }}
          FP_FORCE: ${{ github.event.inputs.force || '0' }}
          FP_SHARD: ${{ matrix.shard }}
      # GitHub turns off schedules in repos with no commits for 60 days: one tiny commit a month keeps it on.
      - name: keep-alive
        if: matrix.shard == 'li0'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u > .keepalive
            git config user.name "fresherpilot-reader"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive && git commit -m "keep-alive" && git push
          fi
